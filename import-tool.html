<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SolarFlow — Import Tool</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f0f0f; color: #e5e5e5; min-height: 100vh; padding: 32px 16px; }
  .wrap  { max-width: 760px; margin: 0 auto; }
  h1     { font-size: 22px; font-weight: 900; color: #fff; margin-bottom: 4px; }
  .sub   { font-size: 12px; color: #666; margin-bottom: 32px; }
  .card  { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 20px; padding: 24px; margin-bottom: 20px; }
  label  { display: block; font-size: 11px; font-weight: 700; color: #888; text-transform: uppercase; letter-spacing: .08em; margin-bottom: 8px; }
  input[type=file], input[type=text], input[type=password] {
    width: 100%; padding: 10px 14px; background: #111; border: 1px solid #333; border-radius: 12px;
    color: #e5e5e5; font-size: 13px; outline: none; transition: border-color .2s;
  }
  input:focus { border-color: #f59e0b; }
  .btn   { padding: 10px 22px; border: none; border-radius: 12px; font-size: 12px; font-weight: 800; cursor: pointer; transition: opacity .2s; }
  .btn-amber { background: #f59e0b; color: #000; }
  .btn-slate { background: #2a2a2a; color: #e5e5e5; }
  .btn:hover { opacity: .85; }
  .row   { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .chip  { display: inline-block; padding: 3px 10px; border-radius: 99px; font-size: 10px; font-weight: 700; }
  .chip-json { background: #1e3a1e; color: #4ade80; border: 1px solid #166534; }
  .chip-text { background: #1e293b; color: #94a3b8; border: 1px solid #334155; }
  .chip-skip { background: #3a1c1c; color: #f87171; border: 1px solid #7f1d1d; }
  pre    { background: #111; border: 1px solid #222; border-radius: 12px; padding: 16px; font-size: 11px; color: #4ade80; overflow: auto; max-height: 260px; white-space: pre-wrap; }
  .log   { font-size: 11px; line-height: 1.7; color: #aaa; }
  .log .ok  { color: #4ade80; }
  .log .err { color: #f87171; }
  .log .warn{ color: #fbbf24; }
  table  { width: 100%; border-collapse: collapse; font-size: 11px; }
  th, td { padding: 8px 12px; text-align: left; border-bottom: 1px solid #222; }
  th     { color: #666; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
  td     { color: #ccc; }
  .badge-json { color: #4ade80; font-weight: 700; }
  .badge-text { color: #94a3b8; }
  hr     { border: none; border-top: 1px solid #222; margin: 20px 0; }
  .warn-box { background: #1c1400; border: 1px solid #854d0e; border-radius: 12px; padding: 14px 16px; font-size: 12px; color: #fbbf24; line-height: 1.6; }
</style>
</head>
<body>
<div class="wrap">

  <h1>SolarFlow Import Tool</h1>
  <p class="sub">Import customer data from Excel / Google Sheets CSV into Supabase — handles JSON columns automatically.</p>

  <!-- Step 1: Credentials -->
  <div class="card">
    <label>Step 1 — Supabase Credentials</label>
    <div style="display:grid;gap:10px;margin-top:4px">
      <input type="text"     id="supa-url"  placeholder="https://xxxx.supabase.co"       />
      <input type="password" id="supa-key"  placeholder="Supabase anon or service key"   />
      <input type="text"     id="supa-table" placeholder="Table name (e.g. admin)"       value="admin" />
    </div>
  </div>

  <!-- Step 2: CSV file -->
  <div class="card">
    <label>Step 2 — Upload CSV file</label>
    <p style="font-size:11px;color:#666;margin-bottom:10px">Export from Google Sheets: File → Download → CSV. From Excel: Save As → CSV UTF-8.</p>
    <input type="file" id="csv-file" accept=".csv" />
  </div>

  <!-- Column mapping preview -->
  <div class="card" id="preview-card" style="display:none">
    <label>Column Analysis</label>
    <p style="font-size:11px;color:#666;margin-bottom:12px">Detected columns and how they will be handled:</p>
    <table>
      <thead><tr><th>Column</th><th>Type</th><th>Sample</th></tr></thead>
      <tbody id="col-table"></tbody>
    </table>
    <hr />
    <div class="warn-box" id="warn-box" style="display:none"></div>
    <div style="margin-top:16px" class="row">
      <button class="btn btn-amber" id="import-btn">Import to Supabase</button>
      <span id="import-status" style="font-size:12px;color:#666"></span>
    </div>
  </div>

  <!-- Log -->
  <div class="card" id="log-card" style="display:none">
    <label>Import Log</label>
    <div id="log-output" class="log"></div>
  </div>

</div>

<script>
// ─── JSON column names in the admin table ─────────────────────────────────────
// These columns are stored as JSONB in Supabase — values must be parsed before insert
const JSON_COLUMNS = new Set([
  'payments', 'subsidy_history', 'follow_ups', 'project_checklist',
  'panel', 'inverter',  // sometimes stored as JSON arrays for multi-select
]);

// These columns should be SKIPPED during import (auto-generated or immutable)
const SKIP_COLUMNS = new Set(['id', 'created_at', 'updated_at']);

// ─── Helpers ──────────────────────────────────────────────────────────────────
function log(msg, cls = '') {
  const el = document.getElementById('log-output');
  document.getElementById('log-card').style.display = 'block';
  el.innerHTML += `<div class="${cls}">${msg}</div>`;
  el.scrollTop = el.scrollHeight;
}

/**
 * Parse a CSV string correctly (handles quoted fields with commas inside).
 * Returns: { headers: string[], rows: string[][] }
 */
function parseCSV(text) {
  const result = [];
  const re = /("(?:[^"]|"")*"|[^,\n\r]*)(,|\r?\n|\r|$)/g;
  let row = [];
  let match;
  while ((match = re.exec(text)) !== null) {
    let val = match[1];
    if (val.startsWith('"') && val.endsWith('"')) {
      val = val.slice(1, -1).replace(/""/g, '"');
    }
    row.push(val);
    if (match[2] !== ',') {
      if (row.length > 1 || row[0] !== '') result.push(row);
      row = [];
    }
    if (match[0] === '') break;
  }
  const headers = result[0] || [];
  const rows = result.slice(1).filter(r => r.some(c => c.trim() !== ''));
  return { headers, rows };
}

/**
 * Smart JSON parser for a cell value.
 * Handles: valid JSON, Excel double-quote escaping, empty → null, plain text
 */
function smartParseJSON(val, colName) {
  if (val === null || val === undefined || val.trim() === '') return null;
  const s = val.trim();

  // Already looks like JSON object or array
  if ((s.startsWith('[') || s.startsWith('{')) ) {
    try { return JSON.parse(s); } catch (_) {}
    // Excel sometimes wraps in extra outer quotes and doubles inner ones
    try { return JSON.parse(s.replace(/""/g, '"')); } catch (_) {}
    // Try removing surrounding quotes Excel adds
    const inner = s.replace(/^"|"$/g, '');
    try { return JSON.parse(inner.replace(/""/g, '"')); } catch (_) {}
    // Fallback: return as empty array so Supabase doesn't reject
    log(`  ⚠ Could not parse JSON for column "${colName}": ${s.slice(0, 60)}... — defaulting to []`, 'warn');
    return [];
  }

  // Plain text that isn't JSON — treat as string, not array
  return s;
}

/**
 * Convert a row (array of strings) into an object using headers.
 * JSON columns are parsed; skip columns are omitted.
 */
function rowToRecord(headers, row) {
  const rec = {};
  headers.forEach((h, i) => {
    const col = h.trim().toLowerCase().replace(/\s+/g, '_');
    if (SKIP_COLUMNS.has(col)) return;
    const raw = (row[i] ?? '').trim();
    if (JSON_COLUMNS.has(col)) {
      rec[col] = smartParseJSON(raw, col);
    } else {
      rec[col] = raw === '' ? null : raw;
    }
  });
  return rec;
}

// ─── Column analysis + preview ────────────────────────────────────────────────
let parsedHeaders = [];
let parsedRows = [];

document.getElementById('csv-file').addEventListener('change', async function() {
  const file = this.files[0];
  if (!file) return;
  const text = await file.text();
  const { headers, rows } = parseCSV(text);
  parsedHeaders = headers;
  parsedRows = rows;

  const tbody = document.getElementById('col-table');
  tbody.innerHTML = '';
  const warnings = [];

  headers.forEach((h, i) => {
    const col = h.trim().toLowerCase().replace(/\s+/g, '_');
    const sample = (rows[0]?.[i] ?? '').slice(0, 60);
    const isSkip = SKIP_COLUMNS.has(col);
    const isJSON = JSON_COLUMNS.has(col);
    const type   = isSkip ? 'skip' : isJSON ? 'json' : 'text';

    // If JSON column contains data that doesn't start with [ or {, warn
    if (isJSON && sample && !sample.startsWith('[') && !sample.startsWith('{') && sample !== '') {
      warnings.push(`Column <b>${col}</b>: expected JSON but got plain text "<em>${sample.slice(0,40)}</em>". It will be stored as-is.`);
    }

    tbody.innerHTML += `<tr>
      <td>${col}</td>
      <td><span class="badge-${type === 'skip' ? 'text' : type === 'json' ? 'json' : 'text'}">${type === 'skip' ? '— skip' : type === 'json' ? 'JSONB' : 'text'}</span></td>
      <td style="color:#555;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${sample || '(empty)'}</td>
    </tr>`;
  });

  const warnBox = document.getElementById('warn-box');
  if (warnings.length) {
    warnBox.style.display = 'block';
    warnBox.innerHTML = '<b>Heads up:</b><ul style="margin-top:6px;padding-left:18px">' + warnings.map(w => `<li>${w}</li>`).join('') + '</ul>';
  } else {
    warnBox.style.display = 'none';
  }

  document.getElementById('preview-card').style.display = 'block';
  log(`Loaded <b>${file.name}</b>: ${rows.length} rows, ${headers.length} columns.`);
});

// ─── Import ───────────────────────────────────────────────────────────────────
document.getElementById('import-btn').addEventListener('click', async () => {
  const url   = document.getElementById('supa-url').value.trim().replace(/\/$/, '');
  const key   = document.getElementById('supa-key').value.trim();
  const table = document.getElementById('supa-table').value.trim();
  const status = document.getElementById('import-status');

  if (!url || !key || !table) { status.textContent = 'Fill in all Supabase credentials first.'; return; }
  if (!parsedRows.length) { status.textContent = 'No CSV loaded.'; return; }

  status.textContent = 'Importing...';
  log(`<b>Starting import → ${table}</b> (${parsedRows.length} rows)`);

  const records = parsedRows.map(row => rowToRecord(parsedHeaders, row));

  // Batch in groups of 50
  const BATCH = 50;
  let success = 0, failed = 0;

  for (let i = 0; i < records.length; i += BATCH) {
    const batch = records.slice(i, i + BATCH);
    try {
      const res = await fetch(`${url}/rest/v1/${table}`, {
        method: 'POST',
        headers: {
          'apikey':        key,
          'Authorization': `Bearer ${key}`,
          'Content-Type':  'application/json',
          'Prefer':        'resolution=merge-duplicates,return=minimal',
        },
        body: JSON.stringify(batch),
      });

      if (res.ok || res.status === 201) {
        success += batch.length;
        log(`<span class="ok">✓ Rows ${i+1}–${Math.min(i+BATCH, records.length)} inserted.</span>`);
      } else {
        const err = await res.text();
        failed += batch.length;
        log(`<span class="err">✗ Rows ${i+1}–${Math.min(i+BATCH, records.length)} failed: ${err.slice(0,200)}</span>`);
      }
    } catch (e) {
      failed += batch.length;
      log(`<span class="err">✗ Network error on batch ${i}: ${e.message}</span>`);
    }
  }

  log(`<b>Done. ${success} rows imported, ${failed} failed.</b>`, success > 0 ? 'ok' : 'err');
  status.textContent = `Done: ${success} success, ${failed} failed.`;
});
</script>
</body>
</html>
