name: Daily Supabase Backup

on:
  schedule:
    - cron: '0 20 * * *'   # 8:00 PM UTC = 1:30 AM IST
  workflow_dispatch:         # manual trigger for testing

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Create backups directory
        run: mkdir -p backups

      # ── Pull data from Supabase ──────────────────────────────────────────────

      - name: Backup admin table (customers)
        run: |
          curl -s -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/admin?select=*" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Accept: text/csv" \
            -o "backups/admin_$(date +%Y-%m-%d).csv"

      - name: Backup activity_log table
        run: |
          curl -s -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/activity_log?select=*&order=created_at.desc&limit=5000" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Accept: text/csv" \
            -o "backups/activity_log_$(date +%Y-%m-%d).csv"

      - name: Backup metadata table
        run: |
          curl -s -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/metadata?select=*" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Accept: text/csv" \
            -o "backups/metadata_$(date +%Y-%m-%d).csv"

      # ── Push CSVs to the private backup repo ────────────────────────────────
      # BACKUP_REPO secret format: "YourGitHubUsername/your-private-backup-repo"
      # BACKUP_PAT  secret: a Personal Access Token with repo (write) scope

      - name: Clone private backup repo
        run: |
          git clone https://x-access-token:${{ secrets.BACKUP_PAT }}@github.com/${{ secrets.BACKUP_REPO }}.git backup-repo

      - name: Copy CSVs into backup repo
        run: |
          mkdir -p backup-repo/$(date +%Y/%m)
          cp backups/*.csv backup-repo/$(date +%Y/%m)/

      - name: Commit and push to private backup repo
        run: |
          cd backup-repo
          git config user.name  "backup-bot"
          git config user.email "backup-bot@users.noreply.github.com"
          git add .
          git commit -m "Backup $(date +'%Y-%m-%d %H:%M UTC')" || echo "Nothing new to commit"
          git push
