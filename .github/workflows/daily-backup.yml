name: Daily Supabase Backup

on:
  schedule:
    - cron: '0 20 * * *'   # 8:00 PM UTC = 1:30 AM IST
  workflow_dispatch:         # manual trigger for testing

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Clone private backup repo
        run: |
          echo "Starting backup at $(date -u)..."
          git clone https://x-access-token:${{ secrets.BACKUP_PAT }}@github.com/${{ secrets.BACKUP_REPO }}.git backup-repo

      # Year/month folder — new folder each month, same files overwritten daily
      - name: Set folder path
        run: echo "FOLDER=$(date +%Y/%m)" >> $GITHUB_ENV

      - name: Create year/month folder
        run: mkdir -p backup-repo/${{ env.FOLDER }}

      # ── Fetch and overwrite the same 3 files each day ────────────────────────

      - name: Backup admin table (customers)
        run: |
          curl -s -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/admin?select=*" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Accept: text/csv" \
            -o "backup-repo/${{ env.FOLDER }}/admin.csv"

      - name: Backup activity_log table
        run: |
          curl -s -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/activity_log?select=*&order=created_at.desc&limit=5000" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Accept: text/csv" \
            -o "backup-repo/${{ env.FOLDER }}/activity_log.csv"

      - name: Backup metadata table
        run: |
          curl -s -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/metadata?select=*" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Accept: text/csv" \
            -o "backup-repo/${{ env.FOLDER }}/metadata.csv"

      # ── Commit (overwrite) — git history tracks every daily snapshot ─────────

      - name: Commit updated files to backup repo
        run: |
          cd backup-repo
          git config user.name  "backup-bot"
          git config user.email "backup-bot@users.noreply.github.com"
          git add ${{ env.FOLDER }}/admin.csv \
                  ${{ env.FOLDER }}/activity_log.csv \
                  ${{ env.FOLDER }}/metadata.csv
          git commit -m "Daily snapshot $(date +'%d %b %Y, %H:%M UTC')" || echo "No changes since last backup"
          git push
          echo "Backup complete ✅"
